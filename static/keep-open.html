<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cmdly</title>
  <link rel="icon" href="icons/32.png">
  <style>
    html, body { margin: 0; height: 100%; background: #1c1c1e; color: #8a8a8a; }
    body { display: grid; place-items: center; font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; text-align: center; }
    body > * { animation: rise 0.35s ease both; }
    img { opacity: 0.6; margin-bottom: 12px; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { body > * { animation: none; } }
  </style>
</head>
<body>
  <div>
    <img src="icons/48.png" width="48" height="48" alt=""><br>
    <p data-i18n="keepOpenText" style="max-width: 420px; margin: 0">This pinned tab keeps the window open when you close the last tab. Cmdly removes it as soon as the window has more tabs.</p>
  </div>
  <script src="keep-open.js"></script>
</body>
</html>
